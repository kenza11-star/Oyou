name: Proses unggahan ZIP
# Trusted processor. Runs ONLY our code from this repository. Uploaded ZIP content is read as
# bytes and committed through the GitHub Git API; it is never checked out, executed or used as workflow code.
on:
  workflow_dispatch: {}      # fired by Vercel right after an upload is queued (no inputs, no secrets in the request)
  schedule:
    - cron: "*/30 * * * *"   # recovery sweep for missed dispatches / interrupted runs (best effort)
permissions:
  contents: read
# One drain at a time. A newer queued run replaces older pending ones, which is fine because
# the active run keeps claiming jobs from the database until the queue is empty.
concurrency:
  group: process-uploads
  cancel-in-progress: false
jobs:
  process:
    if: github.repository == 'kenza11-star/Bot-gitele' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Drain upload queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GITHUB_APP_PRIVATE_KEY_BASE64: ${{ secrets.GH_APP_PRIVATE_KEY_BASE64 }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          GITHUB_APP_SLUG: ${{ secrets.GH_APP_SLUG }}
          APP_URL: ${{ secrets.APP_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
        run: npm run worker:actions
