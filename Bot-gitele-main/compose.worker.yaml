services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env.worker
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    mem_limit: 2g
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
